<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ร้านมือถือป้าแดง — Used Phone Shop Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone-frame">

  <!-- ===================== TOP HUD ===================== -->
  <!-- Always-visible essentials only: shop name/level, day, cash, reputation. -->
  <header class="hud">
    <div class="hud-shop">
      <span class="hud-shop-icon">📱</span>
      <div class="hud-shop-text">
        <span class="hud-shop-name">ร้านมือถือป้าแดง</span>
        <span class="hud-shop-level" id="hudLevel">Lv.0</span>
      </div>
    </div>
    <div class="hud-stats">
      <div class="hud-chip"><span class="hud-chip-icon">📅</span><span id="tsDay">1</span></div>
      <div class="hud-chip cash"><span class="hud-chip-icon">💰</span><span id="tsCash">2,000</span></div>
      <div class="hud-chip"><span class="hud-chip-icon">⭐</span><span id="tsRep">50</span></div>
    </div>
    <button class="hud-endday" id="nextDayBtn" title="จบวัน / วันถัดไป">⏭</button>
  </header>

  <!-- ===================== MAIN SCENE ===================== -->
  <!-- The shop floor. This is the "home" screen — players return here after -->
  <!-- visiting any menu screen. No character/scene animation (per spec #8). -->
  <main class="scene" id="sceneRoot">
    <div class="scene-backdrop">
      <div class="scene-shelf">🗄️📱📱🗄️</div>
      <div class="scene-counter">🧾 เคาน์เตอร์</div>
    </div>
    <div class="scene-floor" id="stageContent"></div>
  </main>

  <!-- ===================== FULL-SCREEN MENU SCREENS ===================== -->
  <!-- Each opens over the whole scene via the icon menu; "กลับร้าน" returns. -->
  <div class="screen-overlay" id="screen-inventory">
    <div class="screen-header">
      <button class="screen-back" onclick="setTab('shop')">← กลับร้าน</button>
      <h2 class="screen-title">📦 คลังมือถือ</h2>
    </div>
    <div class="screen-body" id="inventoryScreenContent"></div>
  </div>

  <div class="screen-overlay" id="screen-upgrades">
    <div class="screen-header">
      <button class="screen-back" onclick="setTab('shop')">← กลับร้าน</button>
      <h2 class="screen-title">🏪 ร้าน / อัปเกรด</h2>
    </div>
    <div class="screen-body">
      <div class="item-card shop-status-card">
        <div class="item-card-head"><span>สถานะร้านวันนี้</span></div>
        <div class="stats-grid">
          <div class="stat-row"><span class="stat-label">วันที่</span><span class="stat-val" id="dayVal">1</span></div>
          <div class="stat-row"><span class="stat-label">เงินสด</span><span class="stat-val cash-val" id="cashVal">2,000</span></div>
          <div class="stat-row"><span class="stat-label">รายรับวันนี้</span><span class="stat-val" id="revVal">0</span></div>
          <div class="stat-row"><span class="stat-label">รายจ่ายวันนี้</span><span class="stat-val" id="expVal">0</span></div>
          <div class="stat-row"><span class="stat-label">กำไรวันนี้</span><span class="stat-val" id="profitVal">0</span></div>
          <div class="stat-row"><span class="stat-label">ความจุคลัง</span><span class="stat-val" id="capVal">0 / 8</span></div>
          <div>
            <span class="stat-label">ชื่อเสียงร้าน</span>
            <div class="rep-bar-track"><div class="rep-bar-fill" id="repBar" style="width:50%"></div></div>
            <div class="rep-level-label" id="repLevelLabel">ปานกลาง (50/100)</div>
          </div>
        </div>
      </div>
      <h3 class="screen-subtitle">อัปเกรดร้าน</h3>
      <div id="upgradesScreenContent"></div>
    </div>
  </div>

  <div class="screen-overlay" id="screen-staff">
    <div class="screen-header">
      <button class="screen-back" onclick="setTab('shop')">← กลับร้าน</button>
      <h2 class="screen-title">👤 พนักงาน</h2>
    </div>
    <div class="screen-body" id="staffScreenContent"></div>
  </div>

  <div class="screen-overlay" id="screen-reports">
    <div class="screen-header">
      <button class="screen-back" onclick="setTab('shop')">← กลับร้าน</button>
      <h2 class="screen-title">📊 รายงานกิจการ</h2>
    </div>
    <div class="screen-body" id="reportsScreenContent"></div>
  </div>

  <div class="screen-overlay" id="screen-settings">
    <div class="screen-header">
      <button class="screen-back" onclick="setTab('shop')">← กลับร้าน</button>
      <h2 class="screen-title">⚙️ ตั้งค่า / บันทึกเกม</h2>
    </div>
    <div class="screen-body" id="settingsScreenContent"></div>
  </div>

  <!-- ===================== MAIN MENU FAB ===================== -->
  <!-- Small, always reachable; opens the icon menu as a bottom sheet. -->
  <button class="menu-fab" id="menuFabBtn" onclick="openMenuSheet()" title="เมนูหลัก">☰</button>

  <!-- Bottom sheet layer: main menu + customer interaction Detail Panel -->
  <div id="sheetRoot"></div>

  <!-- Centered modal layer: receipts, confirmations, item detail popups -->
  <div id="modalRoot"></div>

</div>

<script src="game.js"></script>
</body>
</html>
